name: Update Cardmarket index

# Rebuilds ygo-scanner/data/cm (set code -> Cardmarket product + price) from
# Cardmarket's public catalog and YGOPRODeck, so new sets and prices show up in the scanner.
on:
  schedule:
    - cron: '17 4 * * 1'   # Mondays 04:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cardmarket-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build index
        run: python3 tools/build_cm_index.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ygo-scanner/data/cm
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update Cardmarket index"
            git push
          fi
