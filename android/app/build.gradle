plugins {
    id 'com.android.application'
}

// The app is the same web app as https://zetsuu123.github.io/ygo-scanner/,
// copied from ../../ygo-scanner into the APK's assets at build time.
def webSrc = rootProject.file('../ygo-scanner')
def webOut = layout.buildDirectory.dir('generated/webAssets')

tasks.register('syncWebAssets', Sync) {
    from(webSrc) {
        exclude 'README.md', 'sw.js', '*.apk', 'data/**'
    }
    into(webOut.map { it.dir('www') })
}

// Play Store upload key: read from android/keystore.properties (never committed).
// Without it, release builds fall back to the debug key (fine for sideloading).
def keystoreFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
if (keystoreFile.exists()) { keystoreFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace 'io.github.zetsuu123.ygoscanner'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.zetsuu123.ygoscanner'
        minSdk 24
        targetSdk 36
        versionCode 4
        versionName '1.2'
    }

    sourceSets {
        main.assets.srcDirs += webOut
    }

    signingConfigs {
        if (keystoreFile.exists()) {
            upload {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.upload : signingConfigs.debug
        }
        // Sideload APK for the website: always the debug key, so it keeps installing over earlier APKs.
        sideload {
            initWith release
            signingConfig signingConfigs.debug
            matchingFallbacks = ['release']
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

tasks.named('preBuild') { dependsOn 'syncWebAssets' }

dependencies {
    implementation 'androidx.webkit:webkit:1.14.0'
}
