<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Runeblade 3D</title>
  <meta name="description" content="Interactive 3D model of a skull-hilted runeblade, with a downloadable .glb file.">
  <meta name="theme-color" content="#14121f">
  <style>
    :root { --bg: #14121f; --panel: #1f1c2ecc; --line: #2a2640; --text: #f1edf9; --muted: #a49fb8; --accent: #7ee0c3; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
    #stage { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 42%, #22314a 0%, #131a2b 55%, #080a11 100%); touch-action: none; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    header { position: fixed; top: 0; left: 0; right: 0; padding: max(14px, env(safe-area-inset-top)) 16px 0; pointer-events: none; }
    header a { pointer-events: auto; color: var(--muted); text-decoration: none; font-size: .85rem; }
    header a:hover { color: var(--text); }
    h1 { margin: 4px 0 0; font-size: 1.2rem; font-weight: 650; letter-spacing: .01em; }
    header p { margin: 2px 0 0; color: var(--muted); font-size: .85rem; }
    #status[hidden] { display: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; }
    nav { position: fixed; left: 50%; bottom: max(16px, env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); max-width: calc(100% - 32px); }
    nav button, nav a { appearance: none; border: 0; background: transparent; color: var(--text); font: inherit; font-size: .88rem; padding: 8px 12px; border-radius: 9px; cursor: pointer; text-decoration: none; white-space: nowrap; }
    nav button:hover, nav a:hover { background: #ffffff14; }
    nav button[aria-pressed="true"] { background: #7ee0c322; color: var(--accent); }
    nav a { background: var(--accent); color: #10201b; font-weight: 600; }
    nav a:hover { background: #9cebd3; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (max-width: 420px) { nav button, nav a { padding: 8px 9px; font-size: .82rem; } }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script type="module" src="main.js"></script>
</head>
<body>
  <div id="stage" aria-label="3D view of the runeblade. Drag to orbit, scroll or pinch to zoom."></div>
  <div id="status">Forging the blade…</div>
  <header>
    <a href="../">← zetsuu123</a>
    <h1>Runeblade</h1>
    <p>Drag to orbit · scroll or pinch to zoom</p>
  </header>
  <nav aria-label="View controls">
    <button id="spin" type="button" aria-pressed="true">Spin</button>
    <button id="glow" type="button" aria-pressed="true">Glow</button>
    <button id="reset" type="button">Reset</button>
    <a href="runeblade.glb" download="runeblade.glb">Download .glb</a>
  </nav>
</body>
</html>
