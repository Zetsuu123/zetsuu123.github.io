<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>zetsuu123</title>
  <meta name="theme-color" content="#14121f">
  <link rel="icon" href="ygo-scanner/icons/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg: #14121f; --panel: #1f1c2e; --line: #2a2640; --text: #f1edf9; --muted: #a49fb8; --accent: #7ee0c3; --gold: #e8c36a; color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { max-width: 480px; margin: 0 auto; padding: 48px 16px 32px; }
    h1 { font-size: 1.3rem; margin: 0 0 4px; }
    p.sub { color: var(--muted); margin: 0 0 28px; font-size: .9rem; }
    .app { display: flex; gap: 14px; align-items: center; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; text-decoration: none; color: inherit; }
    .app img { width: 56px; height: 56px; border-radius: 12px; flex: none; }
    .app strong { display: block; }
    .app span { color: var(--muted); font-size: .88rem; }
    .apk { display: inline-block; margin-top: 12px; color: var(--accent); font-size: .9rem; }
    footer { color: var(--muted); font-size: .75rem; text-align: center; margin-top: 40px; }
    footer a { color: var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>zetsuu123</h1>
    <p class="sub">Personal apps.</p>
    <a class="app" href="ygo-scanner/">
      <img src="ygo-scanner/icons/icon-192.png" alt="">
      <div>
        <strong>YGO Card Scanner</strong>
        <span>Scan Yu-Gi-Oh! cards and look them up on Cardmarket.</span>
      </div>
    </a>
    <a class="apk" href="ygo-scanner/ygo-scanner.apk" download>Download the Android app (APK)</a>
    <a class="app" href="home/" style="margin-top:16px">
      <img src="home/icons/icon-192.png" alt="">
      <div>
        <strong>Home Dashboard</strong>
        <span>A wall-tablet dashboard for Home Assistant.</span>
      </div>
    </a>
    <footer><a href="privacy.html">Privacy</a></footer>
  </main>
</body>
</html>
